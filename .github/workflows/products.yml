name: Public product lists

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

# Both publishers write to data; serialize their checkouts and pushes.
concurrency:
  group: history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, marking-calendar]
    # 50 sources, each with a 30-second network timeout; leave time to report failures.
    timeout-minutes: 35
    outputs:
      check_exit_code: ${{ steps.check.outputs.exit_code }}
      source_failure_only: ${{ steps.check.outputs.exit_code == '2' && steps.publish.outcome == 'success' && steps.diagnostics.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Check public product lists
        id: check
        shell: bash
        run: |
          set +e
          python3 build/products.py check --data ./data > products-check.log 2>&1
          exit_code=$?
          set -e
          cat products-check.log
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo '## Товарные перечни'
            echo '```text'
            cat products-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified groups
        id: publish
        if: steps.check.outputs.exit_code == '0' || steps.check.outputs.exit_code == '2'
        shell: bash
        run: |
          if [ ! -f data/products.json ]; then exit 0; fi
          git -C data add -- products.json
          if git -C data diff --cached --quiet; then exit 0; fi
          git -C data -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: проверка товарных перечней'
          git -C data push origin HEAD:data

      - name: Save check diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: products-check
          path: |
            products-check.log
            data/rejected-products/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report source failure
        if: steps.check.outputs.exit_code != '0'
        run: exit 1

  notify:
    needs: publish
    if: always() && (needs.publish.result == 'failure' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data
      - name: Download source diagnostics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name products-check --dir .
      - name: Notify maintainer of failures and recoveries
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTS_JOB_RESULT: ${{ needs.publish.result }}
          PRODUCTS_CHECK_EXIT_CODE: ${{ needs.publish.outputs.check_exit_code }}
          PRODUCTS_SOURCE_FAILURE_ONLY: ${{ needs.publish.outputs.source_failure_only }}
        run: python3 build/products_alert.py
      - name: Save delivered notification state
        shell: bash
        run: |
          if [ ! -f data/products-alert-state.json ]; then exit 0; fi
          git -C data add -- products-alert-state.json
          if git -C data diff --cached --quiet; then exit 0; fi
          git -C data -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: состояние уведомлений о товарных перечнях'
          git -C data push origin HEAD:data
