name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore cross-platform projects
        run: |
          dotnet restore tests/MarkingCalendar.Core.Tests/MarkingCalendar.Core.Tests.csproj -r win-x64 --locked-mode
          dotnet restore tests/MarkingCalendar.Infrastructure.Tests/MarkingCalendar.Infrastructure.Tests.csproj -r win-x64 --locked-mode
          dotnet restore tests/MarkingCalendar.Runner.Tests/MarkingCalendar.Runner.Tests.csproj -r win-x64 --locked-mode

      - name: Test cross-platform projects
        run: |
          dotnet test tests/MarkingCalendar.Core.Tests/MarkingCalendar.Core.Tests.csproj -c Release --no-restore
          dotnet test tests/MarkingCalendar.Infrastructure.Tests/MarkingCalendar.Infrastructure.Tests.csproj -c Release --no-restore
          dotnet test tests/MarkingCalendar.Runner.Tests/MarkingCalendar.Runner.Tests.csproj -c Release --no-restore

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/MarkingCalendar.UI/package-lock.json

      - name: Restore .NET tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore MarkingCalendar.slnx -r win-x64 --locked-mode

      - name: Build and test web interface
        working-directory: src/MarkingCalendar.UI
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Build application
        run: dotnet build MarkingCalendar.slnx -c Release --no-restore -p:SkipUiBuild=true

      - name: Test application
        run: dotnet test MarkingCalendar.slnx -c Release --no-build --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
