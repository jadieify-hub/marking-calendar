name: Public calendar history

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, windows, x64, marking-calendar]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore runner
        run: dotnet restore src/MarkingCalendar.Runner/MarkingCalendar.Runner.csproj -r win-x64 --locked-mode

      - name: Detect data branch
        id: data_branch
        shell: pwsh
        run: |
          git ls-remote --exit-code --heads origin data *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } elseif ($LASTEXITCODE -eq 2) {
            "exists=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Не удалось проверить наличие ветки data (код $LASTEXITCODE)."
          }

      - name: Check out data branch
        if: steps.data_branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Initialize orphan data branch
        if: steps.data_branch.outputs.exists != 'true'
        shell: pwsh
        run: |
          git worktree add --detach data HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C data checkout --orphan data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C data rm -rf .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C data -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --allow-empty -m 'data: initialize branch'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C data push origin HEAD:data
          exit $LASTEXITCODE

      - name: Check calendar source
        id: check
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = @(& dotnet run --project src/MarkingCalendar.Runner/MarkingCalendar.Runner.csproj --configuration Release --no-restore -- check --data ./data 2>&1 | ForEach-Object { $_.ToString() })
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          $batchLine = $output | Where-Object { $_.StartsWith('CHANGED=', [StringComparison]::Ordinal) } | Select-Object -First 1
          if ($batchLine) {
            "changed=true" >> $env:GITHUB_OUTPUT
            "batch_id=$($batchLine.Substring('CHANGED='.Length))" >> $env:GITHUB_OUTPUT
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }
          $countLine = $output | Where-Object { $_.StartsWith('CHANGES=', [StringComparison]::Ordinal) } | Select-Object -First 1
          $changeCount = if ($countLine) { $countLine.Substring('CHANGES='.Length) } else { '0' }
          "change_count=$changeCount" >> $env:GITHUB_OUTPUT

      - name: Copy and validate group map
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Copy-Item -LiteralPath assets/groups/groups.json -Destination data/groups.json -Force
          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath assets/groups/groups.json).Hash
          $copyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath data/groups.json).Hash
          if ($sourceHash -ne $copyHash) { throw 'Карта товарных групп скопирована с ошибкой.' }
          if (Test-Path -LiteralPath data/manifest.json) {
            $manifest = Get-Content -LiteralPath data/manifest.json -Raw | ConvertFrom-Json
            if ($manifest.groupsUrl -ne 'groups.json') {
              if ($manifest.PSObject.Properties.Name -contains 'groupsUrl') {
                $manifest.groupsUrl = 'groups.json'
              } else {
                $manifest | Add-Member -NotePropertyName groupsUrl -NotePropertyValue 'groups.json'
              }
              $manifest | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath data/manifest.json -Encoding utf8
            }
          }
          $output = @(& dotnet run --project src/MarkingCalendar.Runner/MarkingCalendar.Runner.csproj --configuration Release --no-restore -- validate-groups --data ./data 2>&1 | ForEach-Object { $_.ToString() })
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          @('## Карта товарных групп', '```text') + $output + '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $exitCode

      - name: Upload rejected source response
        if: steps.check.outputs.exit_code == '2'
        uses: actions/upload-artifact@v7
        with:
          name: rejected-calendar-response
          path: data/rejected/
          retention-days: 14
          if-no-files-found: warn

      - name: Stop on runner failure
        if: steps.check.outputs.exit_code != '0'
        shell: pwsh
        run: exit [int]'${{ steps.check.outputs.exit_code }}'

      - name: Commit published data
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath data/README.md)) {
            @(
              'Публичная история изменений «Календаря маркировки».'
              'Файлы формируются автоматически из проверенных общедоступных данных честныйзнак.рф.'
            ) | Set-Content -LiteralPath data/README.md -Encoding utf8
          }
          git -C data add -- current.json source.json groups.json manifest.json CHANGELOG.md feed.xml README.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath data/history/changes.json) {
            git -C data add -- history/changes.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C data diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            exit 0
          } elseif ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }
          $dateMsk = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Russian Standard Time').ToString('dd.MM.yyyy')
          $count = '${{ steps.check.outputs.change_count }}'
          if ('${{ steps.check.outputs.changed }}' -eq 'true') {
            $message = "data: $dateMsk — $count изменений"
          } elseif ('${{ steps.data_branch.outputs.exists }}' -eq 'true') {
            $message = "data: $dateMsk — обновление карты групп"
          } else {
            $message = "data: $dateMsk — начальный снимок"
          }
          git -C data -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m $message
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C data push origin HEAD:data
          exit $LASTEXITCODE

      - name: Announce changes in Telegram
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Host 'Telegram announcement skipped: secrets are not configured.'
            exit 0
          }
          $messageFile = Join-Path $env:RUNNER_TEMP 'telegram-message.txt'
          & dotnet run --project src/MarkingCalendar.Runner/MarkingCalendar.Runner.csproj --configuration Release --no-restore -- render-telegram --batch '${{ steps.check.outputs.batch_id }}' --data ./data | Set-Content -LiteralPath $messageFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" `
            -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = (Get-Content -LiteralPath $messageFile -Raw)
            } | Out-Null
