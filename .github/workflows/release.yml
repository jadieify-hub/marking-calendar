name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/MarkingCalendar.UI/package-lock.json

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Некорректный тег версии: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Check release notes
        shell: pwsh
        run: |
          $notes = 'docs/releases/v${{ steps.version.outputs.value }}.md'
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Не найдены заметки выпуска: $notes"
          }

      - name: Build release artifacts
        shell: pwsh
        run: pwsh -NoProfile -File build/pack.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify release artifacts
        shell: pwsh
        run: pwsh -NoProfile -File build/verify-package.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = (Get-ChildItem artifacts/MarkingCalendar-*-full.nupkg -File).FullName
          gh release create '${{ github.ref_name }}' `
            artifacts/MarkingCalendar-Setup.exe `
            artifacts/MarkingCalendar-Portable.zip `
            artifacts/SHA256SUMS.txt `
            artifacts/releases.win.json `
            $package `
            --title "Календарь маркировки ${{ steps.version.outputs.value }}" `
            --notes-file 'docs/releases/v${{ steps.version.outputs.value }}.md'
